[project]
name = "global-temperature-sql"
version = "0.1.0"
description = "An interactive SQL-powered platform for exploring NASA GISTEMP global temperature anomalies."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Translation tables hold long sentences on one line on purpose: easier to compare EN and TR.
"app/i18n.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["challenges", "check_freshness", "clean_data", "components", "database", "db", "download_data",
                     "download_drivers", "download_grid", "export_kaggle", "i18n", "library", "load_drivers",
                     "load_grid", "queries", "run_models", "setup_database", "sql_guard"]

[tool.coverage.run]
# Pipeline scripts are measured while CI runs them (coverage run -p), then combined with
# the pytest run. Not measured: Streamlit page scripts (exercised by tests/test_app.py in a
# separate script runner), the optional benchmark and the network downloaders.
source = ["app", "scripts"]
omit = ["app/views/*", "app/main.py", "scripts/benchmark.py", "scripts/download_*.py"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "app"]

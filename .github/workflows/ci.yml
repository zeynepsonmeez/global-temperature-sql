name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install linters
        run: pip install ruff==0.17.6 sqlfluff==4.5.0

      - name: Python (ruff)
        run: ruff check --output-format=github .

      - name: SQL library (sqlfluff)
        run: sqlfluff lint sql/ --format github-annotation-native

  test:
    runs-on: ubuntu-latest

    # Throwaway credentials that exist only inside this CI job's database container.
    env:
      POSTGRES_DB: global_temperature
      POSTGRES_USER: gts_admin
      POSTGRES_PASSWORD: ci-only-admin-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_READER_USER: gts_reader
      POSTGRES_READER_PASSWORD: ci-only-reader-password
      PSQL_MODE: local
      PYTHONIOENCODING: utf-8

    services:
      db:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_DB: global_temperature
          POSTGRES_USER: gts_admin
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gts_admin -d global_temperature"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache grid downloads
        uses: actions/cache@v5
        with:
          path: data/raw/grid
          key: grid-${{ hashFiles('data/raw/grid/manifest.json') }}

      # Every pipeline script runs under coverage, so the report covers the code that
      # builds the data, not only the code the tests call.
      - name: Build the database and run the pipeline
        run: |
          coverage run -p scripts/setup_database.py
          coverage run -p scripts/clean_data.py         # committed NASA snapshot: reproducible
          coverage run -p scripts/load_data.py
          [ -f data/raw/grid/ne_50m_admin_0_countries.geojson ] || python scripts/download_grid.py
          coverage run -p scripts/load_grid.py --start-year 2015   # ~25M rows in full; a subset here
          coverage run -p scripts/load_drivers.py
          coverage run -p scripts/run_models.py

      - name: Run tests
        run: |
          coverage combine
          pytest -v --cov --cov-append --cov-report=

      - name: Coverage report
        run: |
          coverage combine || true
          coverage report --fail-under=85
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

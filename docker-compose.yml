# Fixed project name: containers, volumes and networks are always prefixed with it,
# so this stack never mixes with other Compose projects on the same machine.
name: global-temperature-sql

services:
  db:
    # PostgreSQL 17 + PostGIS 3.6 on Debian 13 — the same OS base as the earlier postgres:17
    # image, so the existing data directory (and its text collation) stays valid.
    image: postgis/postgis:17-3.6
    container_name: gts-postgres
    restart: unless-stopped
    # Parallel queries on the ~28M-row grid table use shared memory; Docker's default 64 MB is too small.
    shm_size: 512mb
    # Sized for a laptop: larger buffers for the grid table, faster index builds and bulk loads.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB
      -c max_wal_size=4GB
      -c random_page_cost=1.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bind to localhost only: the database is not reachable from other machines.
      # 5433 on the host (not the default 5432) to avoid clashing with other local PostgreSQL servers.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

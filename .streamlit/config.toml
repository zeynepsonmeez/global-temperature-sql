# Two themes, picked from the main menu (⋮). Light is the default: Streamlit itself starts
# on "System", so app/components.py sets "Light" on a visitor's first visit (see default_light_theme).
# Accent colours are tuned per theme for contrast.

[theme]
font = "sans serif"
baseRadius = "medium"

[theme.light]
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101828"

[theme.dark]
base = "dark"
primaryColor = "#F97316"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141D30"
textColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#0F1729"
secondaryBackgroundColor = "#1B2740"

[browser]
gatherUsageStats = false

[server]
runOnSave = true
# Serves app/static/ at /app/static/: the home globe loads plotly.js from there, not a CDN.
enableStaticServing = true

[client]
# Hide developer controls (Deploy, rerun, clear cache) from visitors; the theme menu stays.
toolbarMode = "viewer"
